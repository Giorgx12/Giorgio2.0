name: Compila Giorgio2.0

on:
  push:
  pull_request:

jobs:
  build:
    name: Build kernel-old
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm \
            binutils \
            qemu-system-x86

      - name: Installa Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Verifica strumenti
        run: |
          nasm -v
          zig version
          objcopy --version
          qemu-system-i386 --version

      - name: Compila boot.asm
        run: |
          nasm -f bin boot.asm -o boot.bin

      - name: Compila kernel_entry.asm
        run: |
          nasm -f elf32 kernel_entry.asm -o kernel_entry.o

      - name: Compila porte.asm
        run: |
          nasm -f elf32 porte.asm -o porte.o

      - name: Compila kernel-old.cpp
        run: |
          zig c++ \
            -target x86-freestanding \
            -ffreestanding \
            -fno-exceptions \
            -fno-rtti \
            -fno-sanitize=undefined \
            -c kernel-old.cpp \
            -o kernel-old.o

      - name: Collega kernel-old
        run: |
          zig c++ \
            -target x86-freestanding \
            -nostdlib \
            -fno-exceptions \
            -fno-rtti \
            -fuse-ld=lld \
            -Wl,-T,linker.ld \
            -o kernel-old.elf \
            kernel_entry.o \
            porte.o \
            kernel-old.o

      - name: Converti il kernel in binario
        run: |
          objcopy \
            -O binary \
            kernel-old.elf \
            kernel-old.bin

      - name: Allinea il kernel a 6 settori
        shell: bash
        run: |
          set -e

          kernel_size=$(stat -c%s kernel-old.bin)
          sectors=$(( (kernel_size + 511) / 512 ))

          if [ "$sectors" -gt 6 ]; then
            echo "Errore: kernel-old.bin supera i 6 settori supportati da boot.asm"
            exit 1
          fi

          truncate -s 3072 kernel-old.bin

          echo "Dimensione originale: ${kernel_size} byte"
          echo "Settori utilizzati: ${sectors}"
          echo "Dimensione allineata: $(stat -c%s kernel-old.bin) byte"

      - name: Crea immagine OS
        run: |
          cat boot.bin kernel-old.bin > os-old-image.bin

      - name: Mostra i file generati
        run: |
          ls -lh \
            boot.bin \
            kernel-old.o \
            kernel-old.elf \
            kernel-old.bin \
            os-old-image.bin

      - name: Carica artifact
        uses: actions/upload-artifact@v4
        with:
          name: giorgio2-os-image
          path: |
            os-old-image.bin
            boot.bin
            kernel-old.bin
            kernel-old.elf
