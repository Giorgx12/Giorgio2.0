name: Compila Kernel

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice del repository
      uses: actions/checkout@v4

    - name: Installa gli strumenti necessari (NASM e GCC)
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm build-essential

    - name: Compila il bootloader in file oggetto
      run: nasm -f elf32 boot.asm -o boot.o

    - name: Compila il kernel in C++ (freestanding)
      run: g++ -m32 -ffreestanding -fno-pie -c kernel.cpp -o kernel.o

    - name: Unisci tutto con il Linker
      run: ld -m elf_i386 -Tlinker.ld -o kernel.bin boot.o kernel.o
        
    - name: Mostra che i file sono stati creati
      run: ls -la
    - name: Installa QEMU
      run: sudo apt-get install -y qemu-system-x86

    - name: Test di avvio con QEMU
      run: |
        # Avvia QEMU in modalità test: se il kernel non crasha entro 5 secondi, è un successo!
        timeout 5s qemu-system-i386 -drive format=raw,file=kernel.bin || [ $? -eq 124 ]
        
      
