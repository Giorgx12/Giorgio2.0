name: Compila Kernel

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice del repository
      uses: actions/checkout@v4

    - name: Installa gli strumenti necessari (NASM e GCC)
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm build-essential

    - name: Compila il bootloader in file oggetto
      run: nasm -f bin boot.asm -o boot.bin
      

    - name: Compila le porte in file oggetto
      run: nasm -f elf32 porte.asm -o porte.o

    - name: Compila il kernel in C++ (freestanding)
      run: g++ -m32 -ffreestanding -fno-pie -c kernel.cpp -o kernel.o

    - name: Unisci tutto con il Linker
      run: ld -m elf_i386 -T linker.ld -o kernel.elf porte.o kernel.o

    - name: Converti in binario
      run: objcopy -O binary kernel.elf kernel.bin
      
    - name: Unione finale
      run: cat boot.bin kernel.bin > os-image.bin
      
    - name: Mostra che i file sono stati creati
      run: ls -la

        
        
      
