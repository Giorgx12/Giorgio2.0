name: Compila Kernel

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il repository
      uses: actions/checkout@v4

    - name: Installa NASM e GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm build-essential gcc-multilib

    - name: Compila bootloader
      run: nasm -f bin boot.asm -o boot.bin

    - name: Compila porte.asm
      run: nasm -f elf32 porte.asm -o porte.o

    - name: Compila kernel
      run: g++ -m32 -ffreestanding -fno-pie -c kernel.cpp -o kernel.o

    - name: Linka kernel
      run: ld -m elf_i386 -T linker.ld -o kernel.elf porte.o kernel.o

    - name: Converti kernel in binario
      run: objcopy -O binary kernel.elf kernel.bin

    - name: Crea immagine finale
      run: cat boot.bin kernel.bin > os-image.bin

    - name: Mostra dimensioni
      run: ls -la

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-bin
        path: os-image.bin
