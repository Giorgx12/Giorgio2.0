name: Compila Giorgio2.0

on:
  push:
  pull_request:

jobs:
  build:
    name: Build kernel-old
    runs-on: windows-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa NASM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $nasmVersion = "2.16.01"
          $nasmDir = Join-Path $env:LOCALAPPDATA "bin\NASM"
          $zipPath = Join-Path $env:TEMP "nasm.zip"
          $extractDir = Join-Path $env:TEMP "nasm"

          New-Item -ItemType Directory -Force -Path $nasmDir | Out-Null

          $url = "https://www.nasm.us/pub/nasm/releasebuilds/$nasmVersion/win64/nasm-$nasmVersion-win64.zip"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zipPath

          Expand-Archive `
            -Path $zipPath `
            -DestinationPath $extractDir `
            -Force

          $nasmSourceDir = Join-Path $extractDir "nasm-$nasmVersion"

          Copy-Item `
            -Path (Join-Path $nasmSourceDir "*") `
            -Destination $nasmDir `
            -Recurse `
            -Force

          $nasmExecutable = Join-Path $nasmDir "nasm.exe"

          if (-not (Test-Path $nasmExecutable)) {
            throw "NASM non trovato in $nasmExecutable"
          }

          $nasmDir | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

          & $nasmExecutable -v

      - name: Installa Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Installa MinGW e QEMU
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install mingw qemu -y --no-progress

          $mingwBin = "C:\ProgramData\mingw64\mingw64\bin"

          if (-not (Test-Path (Join-Path $mingwBin "objcopy.exe"))) {
            $objcopy = Get-ChildItem `
              -Path "C:\ProgramData\chocolatey\lib" `
              -Filter "objcopy.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if (-not $objcopy) {
              throw "objcopy.exe non trovato dopo l'installazione di MinGW"
            }

            $mingwBin = $objcopy.Directory.FullName
          }

          $qemu = Get-ChildItem `
            -Path "C:\Program Files", "C:\ProgramData\chocolatey\lib" `
            -Filter "qemu-system-i386.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $qemu) {
            throw "qemu-system-i386.exe non trovato dopo l'installazione di QEMU"
          }

          $mingwBin | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

          $qemu.Directory.FullName | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

      - name: Verifica strumenti
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Get-Command nasm.exe
          Get-Command zig.exe
          Get-Command objcopy.exe
          Get-Command qemu-system-i386.exe

      - name: Compila con build-old.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\build-old.ps1

      - name: Carica immagine OS
        uses: actions/upload-artifact@v4
        with:
          name: giorgio2-os-image
          path: |
            os-old-image.bin
            boot.bin
            kernel-old.bin
            kernel-old.elf
